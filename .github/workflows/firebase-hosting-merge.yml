# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy Firebase on merge
on:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: firebase-live
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/pos-ci.yml
  build_and_deploy:
    needs: verify
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all validation jobs to pass
        if: ${{ needs.verify.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci --prefix functions
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.verify.outputs.build-artifact }}
          path: .
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WEBPOS_14776 }}
      - name: Deploy rules, indexes, functions and hosting
        run: npx --yes firebase-tools@15.28.2 deploy --only "firestore:rules,firestore:indexes,functions,hosting" --project webpos-14776 --non-interactive
