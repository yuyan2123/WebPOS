# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy Firebase on merge
on:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: firebase-live
  cancel-in-progress: false
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run build
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WEBPOS_14776 }}
      - name: Deploy rules, indexes, functions and hosting
        run: npx --yes firebase-tools@15.28.2 deploy --only "firestore:rules,firestore:indexes,functions,hosting" --project webpos-14776 --non-interactive
